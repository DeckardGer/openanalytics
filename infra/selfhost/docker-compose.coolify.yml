# OpenAnalytics on Coolify, Dokploy, CapRover and anything else that owns the
# proxy and hands you one env sheet.
#
# NOT an overlay. This is a whole compose file, used INSTEAD of
# `docker-compose.yml`, because the differences are removals rather than
# additions and an overlay cannot remove. Point the platform at this repository,
# set the base directory to `infra/selfhost`, and name this file.
#
# ## What is different, and why each one had to change
#
# 1. **No `env_file:`.** The twelve `env/*.env` files are git-ignored, so a
#    platform that clones this repository has only the `.example` copies and
#    compose fails on the first missing one. Every service therefore declares its
#    variables inline. The per-service split survives that: what each service is
#    allowed to hold is still enforced at boot by `FORBIDDEN_KEYS`, and this file
#    is written to satisfy it rather than to work around it.
#
# 2. **No `networks:` block.** Coolify's own documentation is explicit that a
#    compose file defining its own networks produces intermittent 504s, because
#    containers end up on two networks and the proxy picks the wrong one.
#
#    Dropping the network also drops the pinned `172.28.0.0/16` subnet, so the
#    Valkey URLs below name services instead of addresses. That used to be fatal.
#    `buildConnectionOptions` (`packages/redis/src/client.ts`) refuses a plaintext
#    `redis://` whose host it cannot prove is private, and it proved that by
#    matching the hostname against the RFC1918 literals, which a service name
#    never matches; every `REALTIME_CACHE_REDIS_URL` here would have been refused
#    at boot. Since 2026-08-14 the check also accepts a **single-label** name,
#    because a label with no TLD has no public resolver that can answer it. That
#    is what makes this file possible at all, and it is not Coolify-specific:
#    none of these platforms lets a template pin an address inside the network
#    it allocates, so all of them need the name to be dialable.
#
# 3. **No Caddy, and no `ports:`.** The platform terminates TLS on 80/443 and
#    routes by hostname. Two proxies cannot both hold those ports.
#
# 4. **The Caddyfile's client-identity rules are rebuilt as Traefik labels.**
#    This is the one removal that costs something real, and it is reinstated
#    below rather than dropped. See the `oa-client-identity` middleware.
#
# 5. **The three signing pairs are generated inside the stack**, by the same
#    `keygen` step `docker-compose.keys.yml` uses, and delivered as files. No
#    platform can generate a keypair whose halves must match across two
#    services; every one of them can generate a random string. So the pairs are
#    made here and each service is handed a path.
#
# 6. **`clickhouse` and `valkey` are our own images now.** They were upstream
#    images plus bind-mounted config, which is the one thing this platform
#    cannot do: it writes the rendered compose file and nothing beside it, so
#    Docker creates an empty **directory** for every missing bind source and
#    ClickHouse dies with "oa-entrypoint.sh: Is a directory". Measured on
#    Coolify 4.3.2. The five files are baked into two images built from the same
#    copies in this directory, so there is still exactly one of each in the tree.
#
# ## Images
#
# Pinned to `v0.3.1`. `v0.3.0` is the floor whatever else moves, because it is
# the release that first publishes `clickhouse` and `valkey`, and without those
# two this variant cannot start at all. Nothing here builds: the platform
# pulls ten images, a couple of minutes rather than the fifteen a build costs on
# a small host.
#
# **Move the pin with the tree.** The compose file, the env templates and the
# migrations ship with the images, so a newer tag against this file is a
# configuration nobody has tested. `OA_IMAGE_TAG` in the platform's env sheet
# overrides it; to run a branch instead, set `OA_IMAGE_REPO=openanalytics` and
# `OA_IMAGE_TAG=local` and all ten build from this repository.

x-node-healthcheck: &node-healthcheck
  test:
    [
      'CMD',
      'node',
      '-e',
      "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
    ]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

# The header rules `Caddyfile:56-64` applies, as a Traefik middleware.
#
# NOT cosmetic, and not TLS. `apps/collector/src/client-identity.ts` reads the
# visitor's address from a small list of headers a fronting proxy is supposed to
# own, and its own comment says the list is safe "only while the fronting proxy
# removes what it does not itself set". Traefik overwrites `X-Forwarded-For` and
# `X-Real-Ip` from the connection on its own, but it does not touch
# `CF-Connecting-IP` and friends, because they are nobody's standard.
#
# Without these lines any visitor can send `cf-connecting-ip` and pick their own
# rate-limit bucket, or send `cf-ipcountry` and write their own country into
# somebody's analytics. An empty value is how Traefik deletes a header.
#
# **`coolify.traefik.middlewares` is the attachment, and it is not optional.**
# Coolify names the routers it generates `https-N-<uuid>-<service>` and renames
# them on every redeploy, so a hand-written `traefik.http.routers.<name>.
# middlewares` label attaches this to a router that does not exist, and it fails
# the worst way available: silently, leaving the headers through. That label is
# Coolify's own directive, consumed at deploy time and appended to whichever
# router it generated.
#
# List syntax rather than a mapping, because that is the form their
# documentation gives and label handling in compose deployments is a part of
# Coolify with a history of edge cases. The whole list is aliased onto the four
# public services; Traefik takes one definition of a middleware and the repeats
# are identical, so defining it more than once costs nothing.
x-client-identity-labels: &client-identity-labels
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.Fly-Client-IP='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.CF-Connecting-IP='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.True-Client-IP='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.X-Vercel-IP-Country='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.X-Vercel-IP-City='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.Fly-Client-Country='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.CF-IPCountry='
  - 'traefik.http.middlewares.oa-client-identity.headers.customRequestHeaders.CF-IPCity='
  - 'coolify.traefik.middlewares=oa-client-identity'

services:
  # --- stores ---------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openanalytics
      POSTGRES_DB: openanalytics
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  # Upstream's server plus the config drop-in and the user-rendering entrypoint,
  # baked in rather than bind-mounted: this platform writes the rendered compose
  # file and nothing beside it, so a relative bind source becomes an empty
  # directory and the container dies with "oa-entrypoint.sh: Is a directory".
  clickhouse:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/clickhouse:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      CLICKHOUSE_INGEST_PASSWORD: ${SERVICE_PASSWORD_CHINGEST}
      CLICKHOUSE_READ_PASSWORD: ${SERVICE_PASSWORD_CHREAD}
      CLICKHOUSE_MAINTENANCE_PASSWORD: ${SERVICE_PASSWORD_CHMAINT}
      CLICKHOUSE_MIGRATION_PASSWORD: ${SERVICE_PASSWORD_CHMIGRATE}
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # The durable event queue. Between the collector's 202 and the worker's
  # insert this instance holds the only copy of an event.
  valkey-queue:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/valkey:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_VALKEYQUEUE}
      # One image, two policies. Durable: appendonly, no eviction. Naming it is
      # required, because a default here would be a guess about whether an
      # acknowledged event may be evicted before the worker inserts it.
      OA_VALKEY_CONF: /usr/local/etc/valkey/valkey-queue.conf
    volumes:
      - valkey-queue-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m

  # Presence, rate-limit counters, short-lived caches. Losable by design.
  valkey-realtime:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/valkey:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${SERVICE_PASSWORD_VALKEYREALTIME}
      # Losable by design: allkeys-lru inside a memory bound.
      OA_VALKEY_CONF: /usr/local/etc/valkey/valkey-realtime.conf
    volumes:
      - valkey-realtime-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  # --- one-shot: the three signing pairs ------------------------------------
  #
  # Lifted from `docker-compose.keys.yml`, which is the tested original. Four
  # separate volumes rather than one, so the split between the api's private
  # halves and each verifier's public half is a filesystem fact and not a
  # convention: a single shared volume would put every private half one `cat`
  # away from every service that only verifies.
  #
  # Idempotent, and that is load-bearing here more than anywhere: these
  # platforms re-run the whole stack on every redeploy, and regenerating would
  # rotate all three pairs behind everyone's back. Each half is written only
  # when missing, and a missing public half is derived from the private one, so
  # an interrupted volume repairs itself.
  #
  # EVERY LITERAL DOLLAR IS DOUBLED. Compose substitutes dollar-variables before
  # the container sees the command, so a single-dollar `$pair` would arrive as an
  # empty string and this would write `/keys/api/.private.pem` three times.
  keygen:
    image: alpine:3.21
    restart: 'no'
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl >/dev/null
        mkdir -p /keys/api /keys/gateway /keys/realtime /keys/collector
        for entry in "query gateway" "realtime realtime" "preview collector"; do
          set -- $$entry
          pair=$$1
          dest=$$2
          if [ ! -f "/keys/api/$$pair.private.pem" ]; then
            openssl genpkey -algorithm ed25519 -out "/keys/api/$$pair.private.pem"
            echo "$$pair: private half generated"
          else
            echo "$$pair: private half exists, left alone"
          fi
          if [ ! -f "/keys/$$dest/$$pair.public.pem" ]; then
            openssl pkey -in "/keys/api/$$pair.private.pem" -pubout \
              -out "/keys/$$dest/$$pair.public.pem"
            echo "$$pair: public half derived for $$dest"
          fi
        done
        # uid 1000 is `node` in the runtime image, which is the user every
        # service runs as.
        chown -R 1000:1000 /keys
        chmod 700 /keys/api /keys/gateway /keys/realtime /keys/collector
        chmod 400 /keys/api/*.pem
        chmod 444 /keys/gateway/*.pem /keys/realtime/*.pem /keys/collector/*.pem
        ls -l /keys/api /keys/gateway /keys/realtime /keys/collector
    volumes:
      - keys-api:/keys/api
      - keys-gateway:/keys/gateway
      - keys-realtime:/keys/realtime
      - keys-collector:/keys/collector

  # --- one-shot: schemas ----------------------------------------------------
  #
  # Both stores build from empty. Re-runs are safe and are the upgrade path:
  # both runners keep a ledger and apply only what is pending.
  migrate:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/migrate:${OA_IMAGE_TAG:-v0.3.1}
    restart: 'no'
    # **Required, not decoration.** This is the worker's image under another
    # tag, so without an entrypoint of its own it boots as the worker, loads the
    # worker's schema, and is refused by the least-privilege boundary:
    # `CLICKHOUSE_MIGRATION_PASSWORD: must not be provided to the "worker"
    # service`. The two CLIs are what a migration actually is.
    entrypoint:
      ['sh', '-c', 'node packages/postgres/dist/cli.js && node packages/clickhouse/dist/cli.js']
    environment:
      ENVIRONMENT: production
      POSTGRES_MIGRATION_URL: postgres://openanalytics:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/openanalytics
      CLICKHOUSE_URL: http://clickhouse:8123
      # `analytics`, and it cannot be anything else: `clickhouse/oa-entrypoint.sh`
      # writes every grant against `analytics.<table>` by name rather than
      # `analytics.*`, so a database called anything else comes up empty of
      # privileges. The stack would go green and then fail on the first read.
      # Note the spelling too: the migration CLI reads CLICKHOUSE_DATABASE while
      # the worker and the gateway read CLICKHOUSE_DB.
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_MIGRATION_USER: oa_migration
      CLICKHOUSE_MIGRATION_PASSWORD: ${SERVICE_PASSWORD_CHMIGRATE}
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # --- one-shot: the browser tracker ----------------------------------------
  #
  # Compiles `oa.js` into a volume the collector serves. On the stock compose
  # Caddy serves it; here the collector does, from the same volume.
  tracker-build:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/tracker-build:${OA_IMAGE_TAG:-v0.3.1}
    restart: 'no'
    volumes:
      - tracker:/out

  # --- services -------------------------------------------------------------

  # The only process allowed to read ClickHouse. Holds the PUBLIC half of the
  # query pair and nothing else; `QUERY_SIGNING_PRIVATE_KEY` is on its
  # FORBIDDEN_KEYS list, and since the file path resolves BEFORE that check,
  # pointing this at the api's private key fails exactly as pasting it here
  # would.
  gateway:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/query-gateway:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 8081
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_READ_USER: oa_read
      CLICKHOUSE_READ_PASSWORD: ${SERVICE_PASSWORD_CHREAD}
      REALTIME_CACHE_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYREALTIME}@valkey-realtime:6379
      QUERY_SIGNING_KEY_ID: oa-selfhost-1
      QUERY_SIGNING_PUBLIC_KEY_FILE: /keys/query.public.pem
    volumes:
      - keys-gateway:/keys:ro
    healthcheck: *node-healthcheck
    depends_on:
      migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      valkey-realtime: { condition: service_healthy }
    mem_limit: 512m

  # Control plane, and the only holder of all three private halves.
  #
  # Started after the gateway: the api sends a field on every gateway query that
  # an older gateway rejects, so an api-first upgrade breaks analytics reads for
  # the length of the window while a gateway-first one has no window at all.
  api:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/api:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 8082
      SERVICE_FQDN_API_8082: /
      DATABASE_URL: postgres://openanalytics:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/openanalytics
      REALTIME_CACHE_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYREALTIME}@valkey-realtime:6379
      QUERY_GATEWAY_URL: http://gateway:8081
      AUTH_BASE_URL: ${SERVICE_URL_API}
      APP_BASE_URL: ${SERVICE_URL_WEB}
      COLLECTOR_BASE_URL: ${SERVICE_URL_COLLECTOR}
      AUTH_TRUSTED_ORIGINS: ${SERVICE_URL_WEB}
      PRODUCT_NAME: Open Analytics
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      TRIAL_IDENTITY_SECRET: ${SERVICE_BASE64_64_TRIALIDENTITY}
      CREDENTIAL_SOURCE_SECRET: ${SERVICE_BASE64_64_CREDENTIALSOURCE}
      OA_CREDENTIAL_KEYRING: '{"active":"k1","keys":{"k1":"${SERVICE_BASE64_KEYRING}"}}'
      QUERY_SIGNING_KEY_ID: oa-selfhost-1
      # The default is `disabled`, written for the hosted product. Every
      # first-run screen here depends on it being on.
      AUTH_PASSWORD_SIGNIN: enabled
      QUERY_SIGNING_PRIVATE_KEY_FILE: /keys/query.private.pem
      REALTIME_TOKEN_SIGNING_KEY_FILE: /keys/realtime.private.pem
      PREVIEW_TOKEN_SIGNING_KEY_FILE: /keys/preview.private.pem
    volumes:
      - keys-api:/keys:ro
    # Traefik picks a container's port from the ports it exposes, and the six
    # backend services share a Dockerfile that declares none. Without this the
    # proxy has nowhere to send the request, so the router is dropped and its
    # certificate is never even requested: no error anywhere, just a hostname
    # that does not answer. Measured on Coolify 4.3.2 against the collector.
    #
    # `expose:` publishes nothing to the host. It is metadata, and it is the
    # metadata every one of these platforms reads.
    expose:
      - '8082'
    labels: *client-identity-labels
    healthcheck: *node-healthcheck
    depends_on:
      migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      gateway: { condition: service_healthy }
      valkey-realtime: { condition: service_healthy }
    mem_limit: 512m

  # Ingest, and the one service that ever sees a raw visitor IP. Also serves
  # `oa.js` from the tracker volume, which on the stock compose is Caddy's job.
  collector:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/collector:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 8083
      SERVICE_FQDN_COLLECTOR_8083: /
      DATABASE_URL: postgres://openanalytics:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/openanalytics
      EVENT_STREAM_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYQUEUE}@valkey-queue:6379
      REALTIME_CACHE_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYREALTIME}@valkey-realtime:6379
      ANONYMOUS_IDENTITY_SECRET: ${SERVICE_BASE64_64_ANONIDENTITY}
      ANONYMOUS_IDENTITY_KEY_VERSION: 1
      PREVIEW_TOKEN_VERIFY_KEY_FILE: /keys/preview.public.pem
      # **Deliberately unset here**, and it has to be. A path is a promise: the
      # collector reads it at boot and refuses to start on a file that is not
      # there, which is right everywhere a database was downloaded on purpose.
      # This platform has no checkout to download into, so the volume below
      # starts empty and setting this would be a crash loop on a fresh install
      # rather than the documented degradation. Unset means null geo, which is
      # what an install with no database should do.
      #
      # To turn it on: copy a database into the volume and then add
      # `GEOIP_DB_PATH=/geoip/dbip-city-lite.mmdb` to the platform's env sheet.
      # SELF-HOSTING.md says how under GeoIP.
    volumes:
      - keys-collector:/keys:ro
      - tracker:/srv/tracker:ro
      # A named volume rather than a bind mount, and it starts **empty**: this
      # platform has no checkout to mount from. So geo is null until somebody
      # puts a database in it, which is the documented degradation rather than a
      # failure. The two files that had to be baked into images could be; a
      # licensed database that is downloaded and refreshed monthly cannot.
      # `docker cp <file> <collector>:/geoip/` fills it, and SELF-HOSTING.md
      # says so under GeoIP.
      - geoip:/geoip
    # Traefik picks a container's port from the ports it exposes, and the six
    # backend services share a Dockerfile that declares none. Without this the
    # proxy has nowhere to send the request, so the router is dropped and its
    # certificate is never even requested: no error anywhere, just a hostname
    # that does not answer. Measured on Coolify 4.3.2 against the collector.
    #
    # `expose:` publishes nothing to the host. It is metadata, and it is the
    # metadata every one of these platforms reads.
    expose:
      - '8083'
    labels: *client-identity-labels
    healthcheck: *node-healthcheck
    depends_on:
      migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      tracker-build: { condition: service_completed_successfully }
      valkey-queue: { condition: service_healthy }
      valkey-realtime: { condition: service_healthy }
    mem_limit: 512m

  # The SSE stream behind the live dashboard.
  realtime:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/realtime:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 8084
      SERVICE_FQDN_REALTIME_8084: /
      REALTIME_CACHE_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYREALTIME}@valkey-realtime:6379
      REALTIME_TOKEN_VERIFY_KEY_FILE: /keys/realtime.public.pem
    volumes:
      - keys-realtime:/keys:ro
    # Traefik picks a container's port from the ports it exposes, and the six
    # backend services share a Dockerfile that declares none. Without this the
    # proxy has nowhere to send the request, so the router is dropped and its
    # certificate is never even requested: no error anywhere, just a hostname
    # that does not answer. Measured on Coolify 4.3.2 against the collector.
    #
    # `expose:` publishes nothing to the host. It is metadata, and it is the
    # metadata every one of these platforms reads.
    expose:
      - '8084'
    labels: *client-identity-labels
    healthcheck: *node-healthcheck
    depends_on:
      migrate: { condition: service_completed_successfully }
      keygen: { condition: service_completed_successfully }
      valkey-realtime: { condition: service_healthy }
    mem_limit: 512m

  # Drains the queue into ClickHouse; sessions, rollups, exports, mail,
  # deletions. Never public.
  worker:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/worker:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: info
      PORT: 8085
      DATABASE_URL: postgres://openanalytics:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/openanalytics
      EVENT_STREAM_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYQUEUE}@valkey-queue:6379
      REALTIME_CACHE_REDIS_URL: redis://:${SERVICE_PASSWORD_VALKEYREALTIME}@valkey-realtime:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_INGEST_USER: oa_ingest
      CLICKHOUSE_INGEST_PASSWORD: ${SERVICE_PASSWORD_CHINGEST}
      CLICKHOUSE_MAINTENANCE_USER: oa_maintenance
      CLICKHOUSE_MAINTENANCE_PASSWORD: ${SERVICE_PASSWORD_CHMAINT}
      ANONYMOUS_IDENTITY_SECRET: ${SERVICE_BASE64_64_ANONIDENTITY}
      ANONYMOUS_IDENTITY_KEY_VERSION: 1
      OA_CREDENTIAL_KEYRING: '{"active":"k1","keys":{"k1":"${SERVICE_BASE64_KEYRING}"}}'
      PRODUCT_NAME: Open Analytics
      EMAIL_FROM: ${OA_EMAIL_FROM:-}
    healthcheck: *node-healthcheck
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey-queue: { condition: service_healthy }
      valkey-realtime: { condition: service_healthy }
    mem_limit: 768m

  # The dashboard. `NEXT_PUBLIC_*` is inlined into the browser bundle at BUILD
  # time, so a pulled image carries whatever the release built. This is the one
  # service a platform install has to build rather than pull if the three
  # origins are not the ones baked in.
  web:
    image: ${OA_IMAGE_REPO:-ghcr.io/openlabs-so/openanalytics}/web:${OA_IMAGE_TAG:-v0.3.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_FQDN_WEB_3000: /
      NEXT_PUBLIC_API_URL: ${SERVICE_URL_API}
      NEXT_PUBLIC_REALTIME_URL: ${SERVICE_URL_REALTIME}
      NEXT_PUBLIC_COLLECTOR_URL: ${SERVICE_URL_COLLECTOR}
    # Traefik picks a container's port from the ports it exposes, and the six
    # backend services share a Dockerfile that declares none. Without this the
    # proxy has nowhere to send the request, so the router is dropped and its
    # certificate is never even requested: no error anywhere, just a hostname
    # that does not answer. Measured on Coolify 4.3.2 against the collector.
    #
    # `expose:` publishes nothing to the host. It is metadata, and it is the
    # metadata every one of these platforms reads.
    expose:
      - '3000'
    labels: *client-identity-labels
    # Its own, not the shared `*node-healthcheck`: that one asks for `/health`,
    # which the six services answer and the dashboard does not. A Next.js app
    # has the routes it has, so it answers `404` there forever, the container
    # never turns healthy, and the proxy serves "no available server" in front
    # of a dashboard that was ready in 283ms. `/login` is the honest probe: it
    # renders without a session, so a `200` means the app is serving.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 512m

volumes:
  pg-data:
  ch-data:
  valkey-queue-data:
  valkey-realtime-data:
  tracker:
  keys-api:
  keys-gateway:
  keys-realtime:
  keys-collector:
  geoip:
