# valkey-realtime — active visitors, Pub/Sub, rate-limit counters, short cache.
#
# Losable by design: everything here is reconstructible, which is why it is a
# separate instance from the queue rather than a second database on it. The two
# need opposite eviction policies, and one process cannot have both.

# --- memory -------------------------------------------------------------
maxmemory-policy allkeys-lru
maxmemory 512mb

# --- durability ---------------------------------------------------------
appendonly no
save ""

dir /data

# --- connection ---------------------------------------------------------
# Plaintext on the compose network only; the compose file publishes no port.
# AUTH is still required — see the note in valkey-queue.conf.
port 6379
protected-mode no
tcp-keepalive 300
timeout 0
