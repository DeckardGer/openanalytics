# valkey-queue — the durable event queue.
#
# Between the collector accepting an event and the worker writing it to
# ClickHouse, THIS INSTANCE HOLDS THE ONLY COPY. Both settings below are
# load-bearing for that; neither is a performance knob.

# --- durability ---------------------------------------------------------
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
appendfilename "appendonly.aof"

save 900 1
save 300 10
save 60 10000

# --- memory -------------------------------------------------------------
# noeviction: under memory pressure the queue must REJECT the write, so the
# collector answers 503 and the tracker retries. Eviction here is silent
# customer-data loss that nothing in the system would report.
#
# Raise `maxmemory` together with the container's `mem_limit` in the compose
# file — a maxmemory above the container limit is an OOM kill instead of the
# rejection this policy exists to produce.
maxmemory-policy noeviction
maxmemory 1gb

# --- storage ------------------------------------------------------------
dir /data

# --- connection ---------------------------------------------------------
# Plaintext on the compose network only; the compose file publishes no port.
# AUTH is still required (the entrypoint appends `requirepass`) because the
# credential is what keeps a neighbouring container from becoming a queue
# writer — the client factory refuses a queue URL without one.
#
# To put the queue on a wire you do not control, terminate TLS here
# (`tls-port`, `tls-cert-file`, `tls-key-file`) and use a `rediss://` URL: the
# connection factory rejects a plaintext URL to a non-private host outright.
port 6379
protected-mode no
tcp-keepalive 300
timeout 0
